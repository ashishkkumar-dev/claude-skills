name: tests

on:
  push:
  pull_request:

jobs:
  check:
    name: repository check
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.find.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_skills.py
      - id: find
        name: find skills that have tests
        run: echo "skills=$(ls -d skills/*/tests 2>/dev/null | cut -d/ -f2 | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.skill }} (Python ${{ matrix.python-version }})
    needs: check
    if: needs.check.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.check.outputs.skills) }}
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          pip install -r requirements-dev.txt
          if [ -f "skills/${{ matrix.skill }}/requirements.txt" ]; then pip install -r "skills/${{ matrix.skill }}/requirements.txt"; fi
      - run: python -m pytest "skills/${{ matrix.skill }}/tests" -q
